<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>icon render</title><style>@import url("../../styles.css");body{background:transparent;margin:0;padding:0}
.icon{position:relative;width:1em;height:1em;font-size:1024px;display:block}
.plate{position:absolute;left:5.5%;top:5.5%;width:89%;height:89%;border-radius:.2003em;overflow:hidden;display:grid;grid-template-columns:.268em .2108em;grid-template-rows:repeat(3,1fr);gap:.0552em;padding:.178em;box-sizing:border-box;background:linear-gradient(180deg,#1c202c,#10121a)}
.plate::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 28% -10%,rgba(255,255,255,.20),rgba(255,255,255,0) 62%)}
.plate::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .005em rgba(255,255,255,.14),inset 0 .006em 0 rgba(255,255,255,.22),inset 0 -.008em .02em rgba(0,0,0,.5)}
.pane{position:relative;border-radius:.04em;z-index:1}
.focused{grid-row:1/4;background:linear-gradient(170deg,#82b7ff,#3d80ea 72%,#2f6ed6);box-shadow:inset 0 .006em 0 rgba(255,255,255,.62),inset 0 -.005em .012em rgba(0,0,0,.28),0 .012em .028em rgba(0,0,0,.42)}
.focused::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 46%)}
.dim{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.075));box-shadow:inset 0 0 0 .004em rgba(255,255,255,.16),inset 0 .005em 0 rgba(255,255,255,.28),0 .008em .02em rgba(0,0,0,.3)}
.light .plate{background:linear-gradient(180deg,#f4f6fa,#d3dae7)}
.light .plate::before{background:radial-gradient(120% 80% at 28% -10%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%)}
.light .plate::after{box-shadow:inset 0 0 0 .005em rgba(255,255,255,.8),inset 0 .006em 0 rgba(255,255,255,.9),inset 0 -.008em .02em rgba(0,0,0,.12)}
.light .dim{background:linear-gradient(180deg,rgba(28,32,44,.30),rgba(28,32,44,.20));box-shadow:inset 0 0 0 .004em rgba(255,255,255,.5),0 .006em .014em rgba(0,0,0,.14)}
.mono .plate{background:linear-gradient(180deg,#5b6070,#3a3e4b)}
.mono .plate::before{background:radial-gradient(120% 80% at 28% -10%,rgba(255,255,255,.26),rgba(255,255,255,0) 62%)}
.mono .focused{background:linear-gradient(170deg,#ffffff,#e3e6ec);box-shadow:inset 0 .006em 0 rgba(255,255,255,.9),0 .012em .028em rgba(0,0,0,.34)}
.mono .focused::after{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 46%)}
.mono .dim{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.12))}
</style></head>
<body>
<div class="icon" id="r-default"><div class="plate"><div class="pane focused"></div><div class="pane dim"></div><div class="pane dim"></div><div class="pane dim"></div></div></div>
<div class="icon light" id="r-light"><div class="plate"><div class="pane focused"></div><div class="pane dim"></div><div class="pane dim"></div><div class="pane dim"></div></div></div>
<div class="icon mono" id="r-mono"><div class="plate"><div class="pane focused"></div><div class="pane dim"></div><div class="pane dim"></div><div class="pane dim"></div></div></div>
</body></html>
