<!-- @dsCard group="Brand" viewport="700x440" name="App Store hero" subtitle="1440×900 marketing shot — icon, claim, and the tree layout as the motif" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AeroSpork — App Store hero</title><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:#0b0d13;display:grid;place-items:center}
#hero{position:relative;width:1440px;height:900px;overflow:hidden;background:linear-gradient(165deg,#212637,#0d0f16 70%);color:#fff;font-family:var(--font-system);display:flex;flex-direction:column;align-items:center;padding:76px 64px 0;box-sizing:border-box}
#hero .glow{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% -8%,rgba(94,158,255,.20),rgba(0,0,0,0) 62%)}
#hero .lock{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
#hero img.icon{width:150px;height:150px;display:block}
#hero h1{margin:0;font-size:60px;font-weight:600;letter-spacing:-.02em;line-height:1.06;max-width:900px}
#hero p{margin:0;font-size:25px;line-height:1.4;color:rgba(255,255,255,.62);max-width:720px}
#hero .screen{position:relative;margin-top:52px;width:1120px;height:470px;border-radius:14px 14px 0 0;overflow:hidden;background:#0f1118;box-shadow:0 -2px 0 rgba(255,255,255,.09),0 40px 90px rgba(0,0,0,.5);display:flex;flex-direction:column}
#hero .mb{height:26px;display:flex;align-items:center;padding:0 14px;gap:12px;background:rgba(18,20,26,.7);font-size:12px}
#hero .mb .chips{margin-left:auto;display:flex;gap:6px;align-items:center;font-family:var(--font-rounded);font-weight:600;font-size:12px}
#hero .chip{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;display:grid;place-items:center;border-radius:5px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);color:rgba(255,255,255,.78)}
#hero .chip.on{background:#fff;color:#12141c;box-shadow:none}
#hero .tiles{flex:1;display:flex;gap:10px;padding:32px 10px 10px}
#hero .t{border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#hero .t.on{background:linear-gradient(170deg,rgba(94,158,255,.30),rgba(61,128,234,.14));box-shadow:inset 0 0 0 1px rgba(126,180,255,.42)}
#hero .col{flex:1;display:flex;flex-direction:column;gap:10px}
</style></head>
<body>
<div id="hero">
  <div class="glow"></div>
  <div class="lock">
    <img class="icon" src="aerospork-icon-1024.png" alt="AeroSpork">
    <h1>Tile your windows. Keep your keyboard.</h1>
    <p>An i3-like tiling window manager for macOS — tree layout, instant workspaces, plain-text TOML, and a settings GUI for the parts you would rather click.</p>
  </div>
  <div class="screen">
    <div class="mb"><span>Ghostty</span><span style="opacity:.7">File</span><span style="opacity:.7">Edit</span>
      <span class="chips"><span class="chip on">1</span><span class="chip">2</span><span class="chip">web</span><span style="opacity:.75">Tue 16:41</span></span></div>
    <div class="tiles"><div class="t on" style="flex:1.3"></div><div class="col"><div class="t" style="flex:1"></div><div class="t" style="flex:1"></div><div class="t" style="flex:1"></div></div></div>
  </div>
</div>
</body></html>
