<!-- @dsCard group="Brand" viewport="700x350" name="README banner" subtitle="1280×640 repo/App Store header — icon, wordmark, menu-bar chips" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AeroSpork banner</title><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:#0b0d13;display:flex;align-items:center;justify-content:center}
#banner{position:relative;width:1280px;height:640px;overflow:hidden;background:linear-gradient(180deg,#1c202c,#0d0f16 78%);display:grid;grid-template-columns:1fr;align-content:center;padding:0 96px;box-sizing:border-box;font-family:var(--font-system);color:#fff}
/* background motif: the layout itself, at plate contrast */
#banner .motif{position:absolute;inset:-8% -12% -8% 46%;display:grid;grid-template-columns:1.45fr 1fr;grid-template-rows:repeat(3,1fr);gap:22px;transform:rotate(-8deg);opacity:.5}
#banner .motif div{border-radius:14px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
#banner .motif div:first-child{grid-row:1/4;background:linear-gradient(170deg,rgba(94,158,255,.30),rgba(61,128,234,.16));box-shadow:inset 0 0 0 1px rgba(126,180,255,.35)}
#banner .glow{position:absolute;inset:0;background:radial-gradient(90% 70% at 12% 0%,rgba(94,158,255,.16),rgba(0,0,0,0) 60%)}
#banner .content{position:relative;display:flex;flex-direction:column;gap:26px;max-width:660px}
#banner .lockup{display:flex;align-items:center;gap:26px}
#banner .lockup img{width:132px;height:132px;display:block}
#banner h1{margin:0;font-size:76px;line-height:1;letter-spacing:-.024em;font-weight:600}
#banner .tag{margin:0;font-size:27px;line-height:1.3;color:rgba(255,255,255,.66);letter-spacing:-.008em;max-width:560px}
#banner .chips{display:flex;gap:10px;align-items:center;font-family:var(--font-rounded);font-weight:600;font-size:22px}
#banner .chip{min-width:44px;padding:0 12px;box-sizing:border-box;height:44px;display:grid;place-items:center;border-radius:11px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);color:rgba(255,255,255,.75)}
#banner .chip.on{background:#fff;color:#12141c;box-shadow:none}
#banner .chip.mode{width:auto;padding:0 18px;border-radius:22px;font-size:20px}
#banner .cmd{font-family:var(--font-mono);font-size:19px;color:rgba(255,255,255,.55)}
</style></head>
<body>
<div id="banner">
  <div class="motif"><div></div><div></div><div></div><div></div></div>
  <div class="glow"></div>
  <div class="content">
    <div class="lockup"><img src="aerospork-icon-1024.png" alt="AeroSpork"><h1>AeroSpork</h1></div>
    <p class="tag">An i3-like tiling window manager for macOS. Tree layout, workspaces without animation, plain-text TOML, and a settings GUI.</p>
  </div>
</div>
</body></html>
