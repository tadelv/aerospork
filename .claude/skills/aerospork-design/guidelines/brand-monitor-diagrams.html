<!-- @dsCard group="Brand" viewport="700x230" name="Monitor diagrams" subtitle="The repo's own SVG explainers for good monitor arrangements" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Monitor diagrams</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:12px;align-items:flex-start}
figure{margin:0;flex:1;display:flex;flex-direction:column;gap:6px}
img{width:100%;border-radius:6px;background:var(--control-bg);box-shadow:0 0 0 .5px var(--separator);display:block}
figcaption{font-size:10px;color:var(--label-tertiary);font-family:var(--font-mono)}</style></head><body><div class="row">
<figure><img src="../assets/product/monitor-arrangement-1-good.svg" alt="good arrangement 1"><figcaption>monitor-arrangement-1-good.svg</figcaption></figure>
<figure><img src="../assets/product/monitor-arrangement-2-good.svg" alt="good arrangement 2"><figcaption>monitor-arrangement-2-good.svg</figcaption></figure>
</div></body></html>
