<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="AppKit metrics, odd numbers included — do not round these to 4s" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;align-items:flex-end;gap:10px}
.c{display:flex;flex-direction:column;align-items:center;gap:5px}
.b{background:var(--accent);opacity:.75;border-radius:2px;width:16px}
.v{font-family:var(--font-mono);font-size:9px;color:var(--label-secondary)}</style></head><body><div class="row"><div class="c"><div class="b" style="height:3.5px"></div><div class="v">1</div></div><div class="c"><div class="b" style="height:7px"></div><div class="v">2</div></div><div class="c"><div class="b" style="height:14px"></div><div class="v">4</div></div><div class="c"><div class="b" style="height:17.5px"></div><div class="v">5</div></div><div class="c"><div class="b" style="height:21px"></div><div class="v">6</div></div><div class="c"><div class="b" style="height:24.5px"></div><div class="v">7</div></div><div class="c"><div class="b" style="height:28px"></div><div class="v">8</div></div><div class="c"><div class="b" style="height:31.5px"></div><div class="v">9</div></div><div class="c"><div class="b" style="height:35px"></div><div class="v">10</div></div><div class="c"><div class="b" style="height:38.5px"></div><div class="v">11</div></div><div class="c"><div class="b" style="height:42px"></div><div class="v">12</div></div><div class="c"><div class="b" style="height:49px"></div><div class="v">14</div></div><div class="c"><div class="b" style="height:56px"></div><div class="v">16</div></div><div class="c"><div class="b" style="height:84px"></div><div class="v">24</div></div></div></body></html>
