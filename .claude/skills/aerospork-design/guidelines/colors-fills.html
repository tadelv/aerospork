<!-- @dsCard group="Colors" viewport="700x150" name="Fills & separators" subtitle="Color.primary.opacity(…) fills, hairline separators, selection" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fills</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;background:var(--control-bg);border-radius:8px;padding:10px;box-shadow:0 0 0 .5px var(--separator)}
.chip{height:30px;border-radius:6px;margin-bottom:7px}.v{font-family:var(--font-mono);font-size:9px;color:var(--label-secondary)}
.n{font-size:11px;font-weight:600;margin-bottom:3px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--fill-subtle)"></div><div class="n">Subtle</div><div class="v">--fill-subtle · 4.5%</div></div>
<div class="sw"><div class="chip" style="background:var(--fill)"></div><div class="n">Fill</div><div class="v">--fill · 6%</div></div>
<div class="sw"><div class="chip" style="background:var(--fill-strong)"></div><div class="n">Strong</div><div class="v">--fill-strong · 8%</div></div>
<div class="sw"><div class="chip" style="background:var(--selection)"></div><div class="n">Selection</div><div class="v">--selection</div></div>
<div class="sw"><div class="chip" style="border-top:1px solid var(--separator);border-radius:0;margin-top:14px"></div><div class="n">Separator</div><div class="v">--separator · 1px</div></div>
</div></body></html>
