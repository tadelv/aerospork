<!-- @dsCard group="Type" viewport="700x180" name="Monospaced = code" subtitle="Anything the user could type into the config file is mono, at any size" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Mono</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-family:var(--font-mono);font-size:13px}
.r{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--separator);padding-bottom:5px}
.w{font-family:var(--font-system);font-size:10px;color:var(--label-tertiary)}</style></head><body><div class="g">
<div class="r"><span>alt-shift-h</span><span class="w">key notation</span></div>
<div class="r"><span>⌥⇧h</span><span class="w">pretty(notation)</span></div>
<div class="r"><span>move-node-to-workspace 3</span><span class="w">command</span></div>
<div class="r"><span>com.apple.mail</span><span class="w">app id</span></div>
<div class="r"><span>~/.aerospork.toml</span><span class="w">path</span></div>
<div class="r"><span>AAAAAAAA-0000-4000…</span><span class="w">display UUID</span></div>
<div class="r"><span>0.4.1 (a91f2c)</span><span class="w">version</span></div>
<div class="r"><span>%{monitor-fingerprint}</span><span class="w">output format</span></div>
</div></body></html>
