<!-- @dsCard group="Colors" viewport="700x150" name="System colors" subtitle="macOS semantic colors — light value / dark value" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>System colors</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:8px}.sw{flex:1;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12)}
.top,.bot{height:44px;display:flex;align-items:flex-end;padding:5px 7px;box-sizing:border-box;font-family:var(--font-mono);font-size:9px;color:#fff}
.cap{padding:5px 7px;font-size:10px;font-weight:600;background:var(--control-bg)}</style></head><body><div class="row">
<div class="sw"><div class="top" style="background:#007aff">#007AFF</div><div class="bot" style="background:#0a84ff">#0A84FF</div><div class="cap">--sys-blue</div></div><div class="sw"><div class="top" style="background:#ff3b30">#FF3B30</div><div class="bot" style="background:#ff453a">#FF453A</div><div class="cap">--sys-red</div></div><div class="sw"><div class="top" style="background:#ff9500">#FF9500</div><div class="bot" style="background:#ff9f0a">#FF9F0A</div><div class="cap">--sys-orange</div></div><div class="sw"><div class="top" style="background:#34c759">#34C759</div><div class="bot" style="background:#30d158">#30D158</div><div class="cap">--sys-green</div></div><div class="sw"><div class="top" style="background:#ffcc00">#FFCC00</div><div class="bot" style="background:#ffd60a">#FFD60A</div><div class="cap">--sys-yellow</div></div><div class="sw"><div class="top" style="background:#8e8e93">#8E8E93</div><div class="bot" style="background:#98989d">#98989D</div><div class="cap">--sys-gray</div></div>
</div></body></html>
