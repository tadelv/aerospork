<!-- @dsCard group="Type" viewport="700x150" name="Rounded — menu bar only" subtitle="SF Rounded semibold appears in exactly one place: the workspace chips" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rounded</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.bar{background:#1c1c1e;border-radius:8px;padding:9px 14px;display:flex;gap:6px;align-items:center}
.chip{font-family:var(--font-rounded);font-weight:600;font-size:17px;color:#fff;height:26px;min-width:26px;padding:0 8px;border-radius:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #fff;opacity:.75;box-sizing:border-box}
.chip.on{background:#fff;color:#12141c;box-shadow:none;opacity:1}
.chip.mode{border-radius:13px}
.note{font-size:11px;color:var(--label-secondary);margin-top:9px}</style></head><body><div class="bar"><span class="chip on">1</span><span class="chip">2</span><span class="chip">web</span><span class="chip mode">service</span></div>
<div class="note">Drawn, never composed from <span class="mono">N.square.fill</span> symbols — those only exist for 0…50 and single capitals, so <span class="mono">web</span> would look nothing like <span class="mono">3</span>.</div></body></html>
