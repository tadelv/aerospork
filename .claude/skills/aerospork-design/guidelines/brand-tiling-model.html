<!-- @dsCard group="Brand" viewport="700x260" name="Tiling model" subtitle="The two layouts, drawn from the design system's own tile styling" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tiling model</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:12px}
figure{margin:0;flex:1;display:flex;flex-direction:column;gap:6px}
img{width:100%;border-radius:6px;box-shadow:0 0 0 .5px var(--separator);display:block}
figcaption{font-size:10px;color:var(--label-tertiary);font-family:var(--font-mono)}</style></head><body><div class="row">
<figure><img src="../../../../docs/assets/layout-modes.png" alt="Tiles beside accordion"><figcaption>docs/assets/layout-modes.png &mdash; source: assets/product/LayoutModes.html</figcaption></figure>
</div></body></html>
