<!-- @dsCard group="Colors" viewport="700x150" name="Brand palette" subtitle="The app icon owns the only non-system colors in the product" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Brand palette</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;background:var(--grouped-bg);font-family:var(--font-system);color:var(--label);box-sizing:border-box}
.lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-tertiary)}
.mono{font-family:var(--font-mono)}
.row{display:flex;gap:10px}.sw{flex:1;height:104px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-sizing:border-box;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,.12)}
.n{font-size:11px;font-weight:600}.v{font-family:var(--font-mono);font-size:10px;opacity:.65}</style></head><body><div class="row">
<div class="sw" style="background:linear-gradient(180deg,#1c202c,#10121a);color:#fff"><span class="n">Plate</span><span class="v">--brand-plate-top / -bottom</span></div>
<div class="sw" style="background:#5e9eff;color:#0b1020"><span class="n">Focused pane</span><span class="v">--brand-focused #5E9EFF</span></div>
<div class="sw" style="background:#4e566a;color:#fff"><span class="n">Dimmed pane</span><span class="v">--brand-dimmed #4E566A</span></div>
</div></body></html>
