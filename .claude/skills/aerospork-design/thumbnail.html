<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AeroSpork</title><link rel="stylesheet" href="styles.css">
<style>body{margin:0;width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:linear-gradient(165deg,#1c202c,#0d0f16);display:grid;place-items:center}
.main span{font-family:var(--font-system);font-weight:600;letter-spacing:-.02em;font-size:150px;color:#fff;line-height:1;white-space:nowrap}
.strip{flex:1;display:flex;flex-direction:column}
.strip i{flex:1;display:block}</style></head>
<body>
<div class="main"><span>AeroSpork</span></div>
<div class="strip"><i style="background:#5e9eff"></i><i style="background:#007aff"></i><i style="background:#4e566a"></i></div>
</body></html>
